<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホームページ作成テンプレート</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: #f7f6f3;
    color: #333;
  }
  .box { text-align: center; padding: 2rem; }
  h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: 0.05em; }
  p { color: #888; font-size: 0.95rem; line-height: 1.9; }
</style>

<body>
  <div class="box">
    <h1>まだホームページは作られていません</h1>
    <p>「参考デザイン」フォルダにスクショを入れて、<br>Claude Code に「ホームページを作って」と伝えてください。<br>できあがるとこのページが置き換わります。</p>
  </div>
</body>
</html>
