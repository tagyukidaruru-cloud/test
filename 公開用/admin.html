<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STYLE ARCHIVE — 管理ダッシュボード</title>
<style>
:root {
  --bg: #f4f0e9;
  --surface: #fdfcfa;
  --ink: #2b2422;
  --ink-2: #5c534e;
  --ink-3: #8a7f77;
  --ink-4: #b5aca4;
  --line: #e3dcd2;
  --accent: #7a4a3a;
  --font-mono: "SF Mono", Menlo, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: "Hiragino Sans", "Yu Gothic", sans-serif; }
body { background: var(--bg); color: var(--ink); min-height: 100vh; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 32px 24px 80px; }
h1 { font-size: 20px; letter-spacing: 0.04em; }
h1 small { font-size: 11px; color: var(--ink-3); font-weight: 400; margin-left: 10px; letter-spacing: 0.15em; }
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.topbar button { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 12px; cursor: pointer; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 20px; overflow: hidden; }
.card-head { padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 14px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.card-body { padding: 18px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }
.periods { display: flex; gap: 6px; }
.periods button { padding: 6px 14px; border-radius: 16px; border: 1px solid var(--line); background: transparent; color: var(--ink-3); font-size: 12px; cursor: pointer; }
.periods button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
canvas { width: 100%; display: block; }
.big { font-family: var(--font-mono); font-size: 30px; }
.sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.kpis { display: flex; gap: 32px; margin-bottom: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: 11px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 9px 12px; color: var(--ink-3); font-weight: 400; font-size: 11px; border-bottom: 1px solid var(--line); }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
.btn-sm { padding: 5px 12px; border-radius: 14px; border: 1px solid #d8b5b1; background: transparent; color: #b4433a; font-size: 11px; cursor: pointer; white-space: nowrap; }
.btn-sm.neutral { border-color: var(--line); color: var(--ink-2); }
textarea { width: 100%; min-height: 80px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; background: #fff; resize: vertical; }
.actions { display: flex; gap: 8px; margin-top: 10px; }
.actions button { padding: 10px 22px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; cursor: pointer; color: var(--ink); }
.actions .primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
/* ログイン */
#login { max-width: 360px; margin: 12vh auto 0; }
#login input { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; margin-bottom: 10px; background: #fff; }
#login button { width: 100%; padding: 13px; border-radius: 22px; border: 0; background: var(--ink); color: var(--bg); font-size: 14px; cursor: pointer; }
.err { color: #b4433a; font-size: 12px; margin-bottom: 10px; min-height: 16px; }
[hidden] { display: none !important; }
</style>
</head>
<body>

<div class="wrap" id="login">
  <h1 style="text-align:center;margin-bottom:8px;">STYLE ARCHIVE</h1>
  <p style="text-align:center;font-size:11px;color:var(--ink-3);letter-spacing:0.2em;margin-bottom:28px;">ADMIN DASHBOARD</p>
  <div class="card"><div class="card-body">
    <div class="err" id="login-err"></div>
    <input type="text" id="l-uid" placeholder="管理者ID" autocomplete="username">
    <input type="password" id="l-pw" placeholder="パスワード" autocomplete="current-password">
    <button id="l-btn">ログイン</button>
  </div></div>
</div>

<div class="wrap" id="dash" hidden>
  <div class="topbar">
    <h1>管理ダッシュボード<small>STYLE ARCHIVE</small></h1>
    <div style="display:flex;gap:8px;align-items:center;">
      <div class="periods" id="periods">
        <button data-d="7">7日</button>
        <button data-d="30" class="on">30日</button>
        <button data-d="90">90日</button>
        <button data-d="0">全期間</button>
      </div>
      <button id="reload">更新</button>
      <button id="logout">ログアウト</button>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="card-head">アカウント推移</div>
      <div class="card-body">
        <div class="kpis">
          <div><div class="big" id="k-total">0</div><div class="sub">累計アカウント</div></div>
          <div><div class="big" id="k-new">0</div><div class="sub">期間内の新規</div></div>
        </div>
        <canvas id="c-accounts" height="220"></canvas>
        <div class="legend"><span><i style="background:#a08064;"></i>日別の新規</span><span><i style="background:#7a4a3a;height:2px;border-radius:0;"></i>累計</span></div>
      </div>
    </div>
    <div class="card">
      <div class="card-head">投稿分析（1時間単位）</div>
      <div class="card-body">
        <div class="kpis">
          <div><div class="big" id="k-posts">0</div><div class="sub">期間内の投稿</div></div>
        </div>
        <canvas id="c-hours" height="220"></canvas>
        <div class="legend" id="hour-legend"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">お知らせ配信 <span style="font-size:11px;color:var(--ink-3);">全ユーザーのホーム上部に表示</span></div>
    <div class="card-body">
      <textarea id="notice"></textarea>
      <div class="actions">
        <button id="notice-clear">削除</button>
        <button id="notice-send" class="primary">配信</button>
      </div>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="card-head">アカウント管理（パスワードリセット）</div>
      <div class="card-body" style="padding:0;"><table id="t-accounts"></table></div>
    </div>
    <div class="card">
      <div class="card-head">投稿の管理</div>
      <div class="card-body" style="padding:0;max-height:480px;overflow-y:auto;"><table id="t-posts"></table></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var URL_ = "https://xwzjrcarawlrcgvynlgh.supabase.co";
  var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3empyY2FyYXdscmNndnlubGdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5OTk1MzQsImV4cCI6MjA5ODU3NTUzNH0.gtHHd0W3KOA02vJO11iZvidaO5-IILYIau_vp77v37E";
  var ADMIN_UID = "administrator_tutumida47";
  var MENUS = ["カット", "カラー", "縮毛矯正", "パーマ", "エクステ", "その他"];
  var COLORS = ["#a08064", "#c98f9c", "#7d9a8c", "#c7a35c", "#8d84b0", "#b5aca4"];
  var state = { accounts: [], posts: [], saves: [], days: 30, adminId: null };

  function sb(method, path, body) {
    return fetch(URL_ + "/rest/v1/" + path, {
      method: method,
      headers: {
        apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json",
        Prefer: method === "POST" ? "resolution=merge-duplicates,return=minimal" : "return=minimal"
      },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error(t); });
      return method === "GET" ? r.json() : null;
    });
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function hashPw(pw, salt) {
    var data = new TextEncoder().encode(String(salt) + ":" + pw);
    return crypto.subtle.digest("SHA-256", data).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
    });
  }
  function isAdminAcc(a) { return (a.role || "").toLowerCase() === ADMIN_UID; }

  /* --- ログイン --- */
  document.getElementById("l-btn").addEventListener("click", tryLogin);
  document.getElementById("l-pw").addEventListener("keydown", function (e) { if (e.key === "Enter") tryLogin(); });
  function tryLogin() {
    var uid = (document.getElementById("l-uid").value || "").trim().toLowerCase();
    var pw = document.getElementById("l-pw").value;
    var err = document.getElementById("login-err");
    if (uid !== ADMIN_UID) { err.textContent = "IDまたはパスワードが違います"; return; }
    sb("GET", "accounts?select=id,role").then(function (accs) {
      var admin = accs.filter(isAdminAcc)[0];
      if (!admin) { err.textContent = "管理アカウントが見つかりません"; return; }
      return sb("GET", "saves?account_id=eq." + admin.id + "&save_id=eq.__pw__&select=bg").then(function (rows) {
        return hashPw(pw, admin.id).then(function (h) {
          if (rows[0] && rows[0].bg === h) {
            state.adminId = admin.id;
            sessionStorage.setItem("sa_admin", String(admin.id));
            enter();
          } else {
            err.textContent = "IDまたはパスワードが違います";
          }
        });
      });
    }).catch(function () { err.textContent = "通信エラー"; });
  }

  function enter() {
    document.getElementById("login").hidden = true;
    document.getElementById("dash").hidden = false;
    loadAll();
  }
  document.getElementById("logout").addEventListener("click", function () {
    sessionStorage.removeItem("sa_admin");
    location.reload();
  });
  document.getElementById("reload").addEventListener("click", loadAll);

  /* --- データ取得 --- */
  function loadAll() {
    Promise.all([
      sb("GET", "accounts?select=*&order=created_at.asc"),
      sb("GET", "posts?select=ts,title,menu,author_name,account_id,visibility&order=ts.desc"),
      sb("GET", "saves?select=account_id,save_id,bg")
    ]).then(function (res) {
      state.accounts = res[0];
      state.posts = res[1];
      state.saves = res[2];
      renderAllDash();
    });
  }

  /* --- 期間フィルタ --- */
  document.querySelectorAll("#periods button").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll("#periods button").forEach(function (x) { x.classList.remove("on"); });
      b.classList.add("on");
      state.days = Number(b.dataset.d);
      renderAllDash();
    });
  });
  function fromTime() {
    if (!state.days) return 0;
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - (state.days - 1));
    return d.getTime();
  }

  function renderAllDash() {
    renderAccounts();
    renderHours();
    renderNotice();
    renderAccountTable();
    renderPostTable();
  }

  /* --- アカウント推移（日別新規バー + 累計ライン） --- */
  function renderAccounts() {
    var accs = state.accounts.filter(function (a) { return !isAdminAcc(a); });
    document.getElementById("k-total").textContent = accs.length;
    var from = fromTime();
    var first = accs.length ? new Date(accs[0].created_at).getTime() : Date.now();
    var start = from || first;
    start = Math.min(Math.max(start, first - 86400000), Date.now());
    // 日別リスト
    var days = [];
    var d = new Date(start); d.setHours(0, 0, 0, 0);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    while (d <= today && days.length < 400) { days.push(d.getTime()); d = new Date(d.getTime() + 86400000); }
    var newByDay = days.map(function (t) {
      return accs.filter(function (a) {
        var at = new Date(a.created_at).getTime();
        return at >= t && at < t + 86400000;
      }).length;
    });
    var beforeStart = accs.filter(function (a) { return new Date(a.created_at).getTime() < days[0]; }).length;
    var cum = []; var c = beforeStart;
    newByDay.forEach(function (n) { c += n; cum.push(c); });
    document.getElementById("k-new").textContent = newByDay.reduce(function (a, b) { return a + b; }, 0);
    drawAccountChart(document.getElementById("c-accounts"), days, newByDay, cum);
  }

  function setupCanvas(cv) {
    if (!cv.dataset.h) cv.dataset.h = cv.getAttribute("height"); // 基準の高さを保持
    var w = cv.clientWidth || 600, h = Number(cv.dataset.h);
    cv.width = w * 2; cv.height = h * 2;
    cv.style.height = h + "px";
    var ctx = cv.getContext("2d");
    ctx.scale(2, 2);
    ctx.clearRect(0, 0, w, h);
    return { ctx: ctx, w: w, h: h };
  }
  function drawAccountChart(cv, days, bars, cum) {
    var s = setupCanvas(cv), ctx = s.ctx, W = s.w, H = s.h;
    var pad = { l: 30, r: 30, t: 12, b: 22 };
    var iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
    var maxBar = Math.max.apply(null, bars.concat([1]));
    var maxCum = Math.max.apply(null, cum.concat([1]));
    var bw = Math.max(2, Math.min(26, iw / days.length - 3));
    // 目盛り
    ctx.strokeStyle = "#e3dcd2"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l, H - pad.b + 0.5); ctx.lineTo(W - pad.r, H - pad.b + 0.5); ctx.stroke();
    days.forEach(function (t, i) {
      var x = pad.l + (iw / days.length) * i + (iw / days.length) / 2;
      // バー(新規)
      var bh = (bars[i] / maxBar) * (ih - 20);
      ctx.fillStyle = "#a08064";
      if (bars[i]) ctx.fillRect(x - bw / 2, H - pad.b - bh, bw, bh);
      // 日付ラベル(まばらに)
      if (days.length <= 14 || i % Math.ceil(days.length / 7) === 0) {
        var dt = new Date(t);
        ctx.fillStyle = "#8a7f77"; ctx.font = "9px sans-serif"; ctx.textAlign = "center";
        ctx.fillText((dt.getMonth() + 1) + "/" + dt.getDate(), x, H - 8);
      }
      // 新規数ラベル
      if (bars[i] && days.length <= 45) {
        ctx.fillStyle = "#5c534e"; ctx.font = "9px monospace"; ctx.textAlign = "center";
        ctx.fillText("+" + bars[i], x, H - pad.b - bh - 4);
      }
    });
    // 累計ライン
    ctx.strokeStyle = "#7a4a3a"; ctx.lineWidth = 2; ctx.beginPath();
    cum.forEach(function (v, i) {
      var x = pad.l + (iw / days.length) * i + (iw / days.length) / 2;
      var y = pad.t + (1 - v / maxCum) * (ih - 20) + 10;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    // 累計の最終値
    var lastX = pad.l + iw - (iw / days.length) / 2;
    var lastY = pad.t + (1 - cum[cum.length - 1] / maxCum) * (ih - 20) + 10;
    ctx.fillStyle = "#7a4a3a"; ctx.beginPath(); ctx.arc(lastX, lastY, 3, 0, 7); ctx.fill();
    ctx.font = "10px monospace"; ctx.textAlign = "right";
    ctx.fillText(String(cum[cum.length - 1]), lastX - 6, lastY - 6);
  }

  /* --- 投稿分析（1時間単位の積み上げバー） --- */
  function renderHours() {
    var from = fromTime();
    var posts = state.posts.filter(function (p) { return Number(p.ts) >= from; });
    document.getElementById("k-posts").textContent = posts.length;
    var grid = [];
    for (var h = 0; h < 24; h++) { grid.push(MENUS.map(function () { return 0; })); }
    posts.forEach(function (p) {
      var h = new Date(Number(p.ts)).getHours();
      (p.menu || []).forEach(function (m) {
        var mi = MENUS.indexOf(m);
        if (mi !== -1) grid[h][mi]++;
      });
    });
    drawHourChart(document.getElementById("c-hours"), grid);
    var lg = document.getElementById("hour-legend");
    lg.innerHTML = MENUS.map(function (m, i) {
      return '<span><i style="background:' + COLORS[i] + ';"></i>' + m + "</span>";
    }).join("");
  }
  function drawHourChart(cv, grid) {
    var s = setupCanvas(cv), ctx = s.ctx, W = s.w, H = s.h;
    var pad = { l: 24, r: 8, t: 10, b: 22 };
    var iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
    var totals = grid.map(function (g) { return g.reduce(function (a, b) { return a + b; }, 0); });
    var max = Math.max.apply(null, totals.concat([1]));
    var slot = iw / 24;
    var bw = Math.max(4, slot - 5);
    ctx.strokeStyle = "#e3dcd2";
    ctx.beginPath(); ctx.moveTo(pad.l, H - pad.b + 0.5); ctx.lineTo(W - pad.r, H - pad.b + 0.5); ctx.stroke();
    for (var h = 0; h < 24; h++) {
      var x = pad.l + slot * h + slot / 2;
      var y = H - pad.b;
      grid[h].forEach(function (v, mi) {
        if (!v) return;
        var bh = (v / max) * (ih - 14);
        ctx.fillStyle = COLORS[mi];
        ctx.fillRect(x - bw / 2, y - bh, bw, bh);
        y -= bh;
      });
      if (totals[h]) {
        ctx.fillStyle = "#5c534e"; ctx.font = "9px monospace"; ctx.textAlign = "center";
        ctx.fillText(String(totals[h]), x, y - 4);
      }
      if (h % 3 === 0) {
        ctx.fillStyle = "#8a7f77"; ctx.font = "9px sans-serif"; ctx.textAlign = "center";
        ctx.fillText(h + "時", x, H - 8);
      }
    }
  }

  /* --- お知らせ --- */
  function currentNotice() {
    return state.saves.filter(function (s) { return s.save_id === "__notice__"; })[0] || null;
  }
  function renderNotice() {
    var n = currentNotice();
    document.getElementById("notice").value = n ? n.bg : "";
  }
  document.getElementById("notice-send").addEventListener("click", function () {
    var text = (document.getElementById("notice").value || "").trim();
    if (!text) { alert("お知らせ内容を入力してください"); return; }
    sb("DELETE", "saves?save_id=eq.__notice__").then(function () {
      return sb("POST", "saves", { account_id: state.adminId, save_id: "__notice__", title: "", author: "", bg: text });
    }).then(function () { alert("配信しました"); loadAll(); });
  });
  document.getElementById("notice-clear").addEventListener("click", function () {
    sb("DELETE", "saves?save_id=eq.__notice__").then(function () {
      document.getElementById("notice").value = "";
      alert("削除しました");
      loadAll();
    });
  });

  /* --- アカウント管理 --- */
  function renderAccountTable() {
    var accs = state.accounts.filter(function (a) { return !isAdminAcc(a); });
    var t = "<tr><th>ニックネーム</th><th>ID</th><th>サロン</th><th>登録日</th><th></th></tr>";
    accs.forEach(function (a) {
      var d = (a.created_at || "").slice(0, 10);
      t += "<tr><td>" + esc(a.name) + "</td><td style='font-family:var(--font-mono);font-size:11px;'>@" + esc(a.role || "") + "</td><td>" + esc(a.salon || "") + "</td><td style='font-family:var(--font-mono);font-size:11px;'>" + d + "</td>" +
        "<td><button class='btn-sm neutral' data-pw='" + a.id + "'>PWリセット</button></td></tr>";
    });
    var el = document.getElementById("t-accounts");
    el.innerHTML = t;
    el.querySelectorAll("[data-pw]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = Number(b.dataset.pw);
        var acc = accs.filter(function (a) { return a.id === id; })[0];
        var np = prompt(acc.name + " さんの新しい仮パスワード（4文字以上）");
        if (!np || np.length < 4) { if (np !== null) alert("4文字以上にしてください"); return; }
        hashPw(np, id).then(function (h) {
          return sb("DELETE", "saves?account_id=eq." + id + "&save_id=eq.__pw__").then(function () {
            return sb("POST", "saves", { account_id: id, save_id: "__pw__", title: "", author: "", bg: h });
          });
        }).then(function () { alert("再設定しました"); loadAll(); });
      });
    });
  }

  /* --- 投稿管理 --- */
  function renderPostTable() {
    var t = "<tr><th>タイトル</th><th>投稿者</th><th>日時</th><th>種別</th><th></th></tr>";
    state.posts.forEach(function (p) {
      var d = new Date(Number(p.ts));
      var when = (d.getMonth() + 1) + "/" + d.getDate() + " " + d.getHours() + ":" + ("0" + d.getMinutes()).slice(-2);
      var kind = p.visibility === "group" ? "グループ" : p.visibility === "draft" ? "下書き" : "公開";
      t += "<tr><td>" + esc(p.title) + "</td><td>" + esc(p.author_name || "") + "</td><td style='font-family:var(--font-mono);font-size:11px;'>" + when + "</td><td style='font-size:11px;color:var(--ink-3);'>" + kind + "</td>" +
        "<td><button class='btn-sm' data-del='" + p.ts + "'>削除</button></td></tr>";
    });
    var el = document.getElementById("t-posts");
    el.innerHTML = t;
    el.querySelectorAll("[data-del]").forEach(function (b) {
      b.addEventListener("click", function () {
        var ts = b.dataset.del;
        var p = state.posts.filter(function (x) { return String(x.ts) === ts; })[0];
        if (!confirm("「" + p.title + "」を削除しますか？")) return;
        Promise.all([
          sb("DELETE", "posts?ts=eq." + ts),
          sb("DELETE", "saves?save_id=eq." + ts),
          sb("DELETE", "saves?save_id=eq.__like__" + ts)
        ]).then(function () { loadAll(); });
      });
    });
  }

  /* 画面サイズが変わったらグラフを描き直す */
  var rsT = null;
  window.addEventListener("resize", function () {
    if (document.getElementById("dash").hidden) return;
    clearTimeout(rsT);
    rsT = setTimeout(renderAllDash, 200);
  });

  /* --- 起動: セッションがあれば自動ログイン --- */
  var saved = sessionStorage.getItem("sa_admin");
  if (saved) {
    state.adminId = Number(saved);
    enter();
  }
})();
</script>
</body>
</html>
